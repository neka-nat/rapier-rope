[package]
name = "rapier-rope"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Validated Rapier rope and tree-harness construction, attachments and diagnostics"
license = "MIT"
repository = "https://github.com/neka-nat/rapier-rope"
publish = ["crates-io"]
readme = "README.md"
documentation = "https://docs.rs/rapier-rope"
keywords = ["physics", "simulation", "rope", "cable", "rapier"]
categories = ["simulation", "science"]
include = [
    "/src/**", "/examples/**", "/tests/**", "/scripts/*.py", "/scripts/*.sh", "/tools/view_track.html",
    "/docs/*.md",
    "/Cargo.toml", "/Cargo.lock", "/rust-toolchain.toml", "/README.md",
    "/README.ja.md", "/CONTRIBUTING.md", "/CHANGELOG.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/.github/workflows/ci.yml",
    "/.gitignore", "/.gitattributes",
]

[features]
default = ["f32"]
f32 = ["dep:rapier_f32"]
f64 = ["dep:rapier_f64"]

[dependencies]
rapier_f32 = { package = "rapier3d", version = "=0.36.0", optional = true }
rapier_f64 = { package = "rapier3d-f64", version = "=0.36.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
sha2 = "0.10"
